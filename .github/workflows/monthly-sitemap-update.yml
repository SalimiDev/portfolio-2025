name: Monthly Sitemap Update

on:
    schedule:
        - cron: '0 0 1 * *'
    workflow_dispatch:
        inputs:
            update_date:
                description: 'Update date (YYYY-MM-DD)'
                required: false
                default: ''

permissions:
    contents: write

jobs:
    update-sitemap:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main
              uses: actions/checkout@v7
              with:
                  ref: main

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '24'

            - name: Update sitemap dates
              env:
                  UPDATE_DATE: ${{ github.event.inputs.update_date }}
              run: node scripts/update-sitemap.mjs

            - name: Commit and push changes
              run: |
                  if git diff --quiet -- public/sitemap.xml; then
                    echo "Sitemap is already up to date"
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add public/sitemap.xml
                  git commit -m "chore: update sitemap date"
                  git push origin main
